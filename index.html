<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bienvenida Pereira — Cuenta Regresiva</title>

  <!-- Etiquetas de vista previa para WhatsApp -->
  <meta property="og:title" content="✨ Bienvenida Pereira — Cuenta Regresiva" />
  <meta property="og:description" content="Toca para ver la historia animada y cuánto falta." />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #141e30 0%, #090d16 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    canvas#fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Botón de música ambiental */
    .audio-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .audio-btn.playing {
      border-color: rgba(255, 209, 102, 0.6);
      background: rgba(255, 209, 102, 0.15);
      color: #ffd166;
    }

    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      width: 12px;
    }

    .equalizer span {
      display: block;
      width: 2.5px;
      height: 4px;
      background: currentColor;
      border-radius: 2px;
    }

    .audio-btn.playing .equalizer span:nth-child(1) { animation: eqBounce 0.7s ease-in-out infinite alternate; }
    .audio-btn.playing .equalizer span:nth-child(2) { animation: eqBounce 0.5s ease-in-out 0.2s infinite alternate; }
    .audio-btn.playing .equalizer span:nth-child(3) { animation: eqBounce 0.8s ease-in-out 0.1s infinite alternate; }

    @keyframes eqBounce { from { height: 3px; } to { height: 12px; } }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 440px);
      padding: 1.5rem 1.2rem 1.8rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeInScale 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .card.celebrating {
      border-color: rgba(255, 209, 102, 0.55);
      box-shadow: 0 20px 60px rgba(255, 209, 102, 0.25);
    }

    /* REPRODUCTOR PIXEL ART */
    .pixel-cinema {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      border: 3px solid #27273a;
      overflow: hidden;
      margin-bottom: 1.2rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    canvas#pixel-screen {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .sc-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.72);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.38rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 500;
      color: #ffd166;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .sc-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: #ffd166;
      transition: width 0.1s linear;
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffd166;
      background: rgba(255, 209, 102, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.25);
      margin-bottom: 0.8rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5.5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #ffd166 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
      animation: glowPulse 3s ease-in-out infinite;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.4rem;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .time-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.75rem 0.2rem;
    }

    .time-box.tick {
      transform: scale(1.03);
      border-color: rgba(255, 209, 102, 0.35);
    }

    .number {
      display: block;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.1;
    }

    .label {
      display: block;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-top: 0.3rem;
    }

    .footer-note {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 209, 102, 0.15)); }
      50% { filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.4)); }
    }
  </style>
</head>
<body>
  <canvas id="fx-canvas"></canvas>

  <button class="audio-btn" id="audio-toggle" type="button" aria-label="Música ambiental">
    <span class="equalizer" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
    <span id="audio-label">Música ambiental</span>
  </button>

  <main class="card" id="main-card">
    <!-- REPRODUCTOR DE LA HISTORIA PIXEL ART -->
    <div class="pixel-cinema">
      <div class="sc-progress" id="sc-progress" style="width: 0%"></div>
      <canvas id="pixel-screen" width="240" height="135"></canvas>
      <div class="sc-info">
        <span id="sc-desc">1. Tomando el taxi...</span>
        <span id="sc-num">1/6</span>
      </div>
    </div>

    <span class="badge">Sábado • 7:00 AM</span>
    <h1>Bienvenida Pereira</h1>
    <p class="subtitle" id="status-text">Falta muy poco para vernos</p>

    <section class="timer-grid">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Días</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Horas</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Min</span>
      </div>
      <div class="time-box" id="sec-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seg</span>
      </div>
    </section>

    <p class="footer-note">Actualizado en tiempo real</p>
  </main>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN DEL REPRODUCTOR CINEMÁTICO PIXEL ART
    // ==========================================
    const cinemaCanvas = document.getElementById("pixel-screen");
    const cctx = cinemaCanvas.getContext("2d");
    
    let currentScene = 0;
    let sceneTimer = 0;
    const sceneDuration = 5500; // 5.5 segundos por escena
    
    const scenes = [
      { text: "1. Tomando un taxi", code: 1 },
      { text: "2. Al aeropuerto El Dorado", code: 2 },
      { text: "3. El despegue de Bogotá", code: 3 },
      { text: "4. Llegada a Pereira", code: 4 },
      { text: "5. Saliendo de la terminal", code: 5 },
      { text: "6. ¡El abrazo!", code: 6 }
    ];

    let t = 0; // tiempo local de la escena para animaciones

    function drawPixelArtScene() {
      t += 0.05;
      sceneTimer += 16.67; // aprox 60fps
      
      const percent = (sceneTimer / sceneDuration) * 100;
      document.getElementById("sc-progress").style.width = Math.min(percent, 100) + "%";

      if (sceneTimer >= sceneDuration) {
        sceneTimer = 0;
        currentScene = (currentScene + 1) % scenes.length;
        document.getElementById("sc-desc").textContent = scenes[currentScene].text;
        document.getElementById("sc-num").textContent = (currentScene + 1) + "/6";
        t = 0; // reset animacion local
      }

      // Limpiar pantalla
      cctx.fillStyle = "#090d16";
      cctx.fillRect(0, 0, 240, 135);

      const code = scenes[currentScene].code;

      if (code === 1) {
        // TOMA 1: Una chica con maleta tomando un taxi
        // Cielo y sol atardecer
        drawSunsetSky();
        // Edificios silueta
        drawBuildings(2);
        // Calle
        drawGround();
        // Maleta
        drawPixelRect("#c026d3", 152, 94, 6, 8); // maleta fucsia
        drawPixelRect("#475569", 154, 91, 3, 3); // manija
        // Chica (caminando/esperando)
        const walk = Math.sin(t * 3) * 2;
        drawPerson("#f43f5e", "#1e3a8a", 160 + Math.sin(t*1.5)*1.5, 82, walk, true); // Chica
        // Taxi
        let tx = Math.max(12, 105 - (t * 12));
        drawTaxi(tx, 86);
      } 
      else if (code === 2) {
        // TOMA 2: Taxi llegando al aeropuerto de Bogotá
        drawDaytimeSky();
        drawBuildings(1);
        drawGround();
        
        // Letrero aeropuerto
        drawPixelRect("#1e293b", 60, 14, 120, 14);
        cctx.fillStyle = "#ffd166";
        cctx.font = "6px monospace";
        cctx.fillText("BOG - AEROPUERTO EL DORADO", 66, 23);

        // Taxi llegando y frenando
        let tx = Math.min(84, -20 + (t * 22));
        drawTaxi(tx, 86);

        // Pasajera bajando
        if (t > 3) {
          drawPerson("#f43f5e", "#1e3a8a", tx + 18, 83, 0, false); // chica
          drawPixelRect("#c026d3", tx + 24, 95, 5, 6); // maleta
        }
      } 
      else if (code === 3) {
        // TOMA 3: Despegue
        drawSkyGradient("#0284c7", "#bae6fd");
        drawRollingClouds(t);
        // Suelo / Pista
        drawPista();
        
        // Avión subiendo
        let ax = 20 + t * 24;
        let ay = 95 - t * 7;
        drawPlane(ax, ay, true);
      } 
      else if (code === 4) {
        // TOMA 4: Avión llegando a Pereira
        drawSkyGradient("#bae6fd", "#fef08a");
        // Montañas de Pereira (Eje Cafetero)
        drawMountains();
        drawPista();
        
        // Letrero Matecaña
        cctx.fillStyle = "#1e3a8a";
        cctx.fillRect(15, 60, 65, 8);
        cctx.fillStyle = "#ffffff";
        cctx.font = "5px monospace";
        cctx.fillText("PEI - MATECAÑA", 19, 66);

        // Avión descendiendo
        let ax = -40 + t * 24;
        let ay = 45 + t * 6;
        drawPlane(ax, ay, false);
      } 
      else if (code === 5) {
        // TOMA 5: La chica saliendo
        drawSunsetSky();
        drawMatecanaGate();
        drawGround();

        // Puertas abiertas
        drawPixelRect("#38bdf8", 40, 50, 18, 38, 0.4);
        drawPixelRect("#38bdf8", 70, 50, 18, 38, 0.4);

        // Chica saliendo feliz con su maleta
        let cx = 10 + (t * 12);
        if (cx < 100) {
          drawPerson("#f43f5e", "#1e3a8a", cx, 83, Math.sin(t*4.2)*2.2, true); // chica
          drawPixelRect("#c026d3", cx - 5, 94, 5, 6); // maleta arrastrándose
        } else {
          drawPerson("#f43f5e", "#1e3a8a", 100, 83, 0, true);
          drawPixelRect("#c026d3", 95, 94, 5, 6);
        }
      } 
      else if (code === 6) {
        // TOMA 6: El reencuentro (Abrazo)
        drawSunsetSky();
        drawMountains();
        drawBuildings(1);
        drawGround();

        // Chica (lado izquierdo) y chico (lado derecho) encontrándose
        let cx = Math.min(108, 60 + (t * 10)); // chica
        let cy = Math.max(122, 160 - (t * 9)); // chico

        // Maleta en el piso quieta
        drawPixelRect("#c026d3", 91, 95, 5, 6);

        if (cx < 108) {
          drawPerson("#f43f5e", "#1e3a8a", cx, 83, Math.sin(t*5)*2.5, true); // chica
          drawPerson("#059669", "#374151", cy, 83, Math.sin(t*5.5)*2.5, false); // chico
        } else {
          // Abrazo juntándose
          drawPerson("#f43f5e", "#1e3a8a", 107, 82, 0, false);
          drawPerson("#059669", "#374151", 113, 82, 0, false);
          
          // Corazones pixelados que flotan
          cctx.fillStyle = "#f43f5e";
          let hy = 62 - (Math.sin(t*3)*3);
          cctx.fillRect(108, hy, 3, 3);
          cctx.fillRect(110, hy, 3, 3);
          cctx.fillRect(113, hy-8, 3, 3);
          cctx.fillRect(105, hy-12, 3, 3);
        }
      }

      requestAnimationFrame(drawPixelArtScene);
    }

    // ==========================================
    // FUNCIONES AUXILIARES DE DIBUJO PIXEL
    // ==========================================
    function drawPixelRect(color, x, y, w, h, alpha = 1) {
      cctx.save();
      cctx.globalAlpha = alpha;
      cctx.fillStyle = color;
      cctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      cctx.restore();
    }

    function drawSunsetSky() {
      let grad = cctx.createLinearGradient(0,0,0,100);
      grad.addColorStop(0, "#1e1b4b");
      grad.addColorStop(0.5, "#431407");
      grad.addColorStop(1, "#fb923c");
      cctx.fillStyle = grad;
      cctx.fillRect(0,0,240,105);
    }

    function drawDaytimeSky() {
      let grad = cctx.createLinearGradient(0,0,0,100);
      grad.addColorStop(0, "#0284c7");
      grad.addColorStop(1, "#bae6fd");
      cctx.fillStyle = grad;
      cctx.fillRect(0,0,240,105);
    }

    function drawSkyGradient(c1, c2) {
      let grad = cctx.createLinearGradient(0,0,0,100);
      grad.addColorStop(0, c1);
      grad.addColorStop(1, c2);
      cctx.fillStyle = grad;
      cctx.fillRect(0,0,240,105);
    }

    function drawMountains() {
      // Montañas de fondo verdes
      cctx.fillStyle = "#064e3b";
      cctx.beginPath();
      cctx.moveTo(0, 105);
      cctx.lineTo(40, 65);
      cctx.lineTo(90, 85);
      cctx.lineTo(160, 48);
      cctx.lineTo(210, 75);
      cctx.lineTo(240, 105);
      cctx.fill();
    }

    function drawGround() {
      drawPixelRect("#1e293b", 0, 95, 240, 40); // calle oscura
      drawPixelRect("#ffd166", 0, 108, 240, 2); // línea central amarilla discontinua
    }

    function drawPista() {
      drawPixelRect("#334155", 0, 90, 240, 45); // pista de asfalto
      drawPixelRect("#cbd5e1", 0, 93, 240, 2); // demarcación pista
      drawPixelRect("#ef476f", 10, 90, 8, 3); // luces pista rojas
      drawPixelRect("#ef476f", 140, 90, 8, 3);
    }

    function drawBuildings(type) {
      cctx.fillStyle = type === 1 ? "#0f172a" : "#311042"; // Edificios oscuros silueta
      cctx.fillRect(10, 40, 32, 60);
      cctx.fillRect(52, 28, 26, 75);
      cctx.fillRect(85, 45, 40, 60);
      cctx.fillRect(135, 32, 38, 70);
      cctx.fillRect(182, 52, 28, 50);

      // Ventanas aleatorias iluminadas
      cctx.fillStyle = "#fef08a";
      if (Math.round(t) % 2 === 0) {
        cctx.fillRect(18, 50, 4, 4);
        cctx.fillRect(58, 38, 4, 4);
        cctx.fillRect(92, 58, 4, 4);
        cctx.fillRect(144, 42, 4, 4);
      }
    }

    function drawTaxi(x, y) {
      // Cuerpo Taxi Amarillo
      drawPixelRect("#eab308", x, y + 5, 26, 12);
      drawPixelRect("#eab308", x + 4, y, 16, 8);
      
      // Letrero Taxi
      drawPixelRect("#ffffff", x + 9, y - 2, 6, 3);
      drawPixelRect("#000000", x + 11, y - 2, 2, 2);

      // Cristales
      drawPixelRect("#0284c7", x + 5, y + 1, 5, 4);
      drawPixelRect("#0284c7", x + 12, y + 1, 5, 4);

      // Ruedas
      drawPixelRect("#0f172a", x + 3, y + 14, 5, 4);
      drawPixelRect("#0f172a", x + 17, y + 14, 5, 4);
      
      // Luces
      drawPixelRect("#fb923c", x, y + 7, 2, 3); // faro frontal
    }

    function drawPerson(camisa, pantalon, x, y, walkEffect, miraDerecha) {
      // Cabeza / Pelo
      drawPixelRect("#78350f", x + 1, y, 5, 5); // pelo
      drawPixelRect("#fed7aa", x + 2, y + 2, 3, 3); // piel cara

      // Cuerpo
      drawPixelRect(camisa, x + 1, y + 5, 5, 8); // camisa
      
      // Piernas (animación de caminata usando walkEffect)
      drawPixelRect(pantalon, x + 1, y + 13 + Math.max(0, walkEffect), 2, 4);
      drawPixelRect(pantalon, x + 4, y + 13 + Math.max(0, -walkEffect), 2, 4);
    }

    function drawPlane(x, y, subiendo) {
      // Fuselaje principal
      drawPixelRect("#ffffff", x, y + 4, 40, 8);
      // Cabina
      drawPixelRect("#475569", x + 34, y + 5, 4, 3);
      // Ala frontal
      cctx.fillStyle = "#1e3a8a";
      cctx.beginPath();
      cctx.moveTo(x + 12, y + 11);
      cctx.lineTo(x + 18, y + 22);
      cctx.lineTo(x + 24, y + 22);
      cctx.lineTo(x + 18, y + 11);
      cctx.fill();

      // Ala de cola
      drawPixelRect("#1e3a8a", x + 1, y - 1, 6, 7);
      
      // Ventanas diminutas
      cctx.fillStyle = "#334155";
      cctx.fillRect(x + 12, y + 6, 3, 2);
      cctx.fillRect(x + 18, y + 6, 3, 2);
      cctx.fillRect(x + 24, y + 6, 3, 2);
    }

    function drawRollingClouds(t) {
      cctx.fillStyle = "rgba(255,255,255,0.45)";
      let cx = (t * 15) % 280;
      cctx.fillRect(280 - cx, 15, 30, 10);
      cctx.fillRect(265 - cx, 12, 20, 8);
      
      let cx2 = (t * 8) % 320;
      cctx.fillRect(320 - cx2, 35, 45, 12);
    }

    function drawMatecanaGate() {
      // Terminal de Pereira Matecaña
      drawPixelRect("#0f172a", 15, 40, 100, 55); // Fachada oscura
      drawPixelRect("#facc15", 25, 43, 80, 5); // Letrero amarillo
    }

    // ==========================================
    // 2. LÓGICA DE CUENTA REGRESIVA
    // ==========================================
    const targetDate = new Date("2026-11-14T07:00:00-05:00").getTime();

    const mainCard = document.getElementById("main-card");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const secBox = document.getElementById("sec-box");
    const statusText = document.getElementById("status-text");

    let hasCelebrated = false;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function triggerArrivalCelebration() {
      if (hasCelebrated) return;
      hasCelebrated = true;

      mainCard.classList.add("celebrating");
      statusText.textContent = "¡Llegó el momento! Bienvenida a Pereira ✨";

      // Explosiones de confeti en el canvas de fondo
      spawnConfettiBurst(canvas.width * 0.5, canvas.height * 0.65, 140);
      setTimeout(() => {
        spawnConfettiBurst(canvas.width * 0.2, canvas.height * 0.6, 75);
        spawnConfettiBurst(canvas.width * 0.8, canvas.height * 0.6, 75);
      }, 500);
    }

    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        triggerArrivalCelebration();
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);

      secBox.classList.remove("tick");
      void secBox.offsetWidth;
      secBox.classList.add("tick");
    }

    // ==========================================
    // 3. CANVAS DE EFECTOS (CONFETI DE FONDO)
    // ==========================================
    const canvas = document.getElementById("fx-canvas");
    const ctx = canvas.getContext("2d");
    let ambientParticles = [];
    let confettiPieces = [];

    const confettiColors = ["#ffd166", "#ef476f", "#06d6a0", "#38bdf8", "#f8fafc", "#c084fc"];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Partículas doradas
    for (let i = 0; i < 45; i++) {
      ambientParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.2 + 0.6,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.6 - 0.2,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function spawnConfettiBurst(originX, originY, count) {
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const speed = Math.random() * 11 + 5;
        confettiPieces.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          w: Math.random() * 8 + 5,
          h: Math.random() * 5 + 3,
          color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.22,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: Math.random() * 0.08 + 0.03
        });
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of ambientParticles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 209, 102, ${p.alpha})`;
        ctx.fill();
      }

      for (let i = confettiPieces.length - 1; i >= 0; i--) {
        const c = confettiPieces[i];
        c.vy += 0.22;
        c.vx *= 0.985;
        c.swayPhase += c.swaySpeed;
        c.x += c.vx + Math.sin(c.swayPhase) * 0.9;
        c.y += c.vy;
        c.rotation += c.rotationSpeed;

        if (c.y > canvas.height + 30) {
          confettiPieces.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rotation);
        ctx.scale(1, Math.cos(c.swayPhase));
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    // Iniciar bucles de renderizado
    updateCountdown();
    setInterval(updateCountdown, 1000);
    renderLoop();
    drawPixelArtScene(); // Activar película retro

    // Ráfaga al abrir
    setTimeout(() => {
      if (!hasCelebrated) {
        spawnConfettiBurst(canvas.width * 0.5, canvas.height * 0.65, 90);
      }
    }, 200);

    // ==========================================
    // 4. SINTETIZADOR DE MÚSICA AMBIENTAL
    // ==========================================
    const audioBtn = document.getElementById("audio-toggle");
    const audioLabel = document.getElementById("audio-label");

    let audioCtx = null;
    let masterGain = null;
    let chordInterval = null;
    let isPlaying = false;
    let chordStep = 0;

    const ambientChords = [
      [174.61, 220.00, 261.63, 329.63, 392.00], // Fmaj9
      [130.81, 196.00, 246.94, 293.66, 329.63], // Cmaj9
      [220.00, 261.63, 329.63, 392.00, 587.33], // Am11
      [196.00, 261.63, 329.63, 392.00, 440.00]  // G6sus4
    ];

    function playAmbientChord(frequencies) {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;
      const duration = 5.2;

      frequencies.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const noteGain = audioCtx.createGain();

        osc.type = idx % 2 === 0 ? "sine" : "triangle";
        osc.frequency.setValueAtTime(freq, now);
        osc.detune.setValueAtTime((idx - 2) * 4, now);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(620, now);

        noteGain.gain.setValueAtTime(0.0001, now);
        noteGain.gain.linearRampToValueAtTime(0.032, now + 1.6);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(masterGain);

        osc.start(now);
        osc.stop(now + duration + 0.1);
      });
    }

    async function toggleAmbientMusic() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      if (!isPlaying) {
        isPlaying = true;
        audioBtn.classList.add("playing");
        audioLabel.textContent = "Pausar música";

        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
        masterGain.gain.linearRampToValueAtTime(0.85, now + 1.2);

        playAmbientChord(ambientChords[chordStep % ambientChords.length]);
        chordStep++;
        chordInterval = setInterval(() => {
          playAmbientChord(ambientChords[chordStep % ambientChords.length]);
          chordStep++;
        }, 4200);
      } else {
        isPlaying = false;
        audioBtn.classList.remove("playing");
        audioLabel.textContent = "Música ambiental";

        clearInterval(chordInterval);
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
      }
    }

    audioBtn.addEventListener("click", toggleAmbientMusic);
  </script>
</body>
