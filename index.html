<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bienvenida Pereira — Cuenta Regresiva</title>

  <!-- Etiquetas de vista previa para WhatsApp -->
  <meta property="og:title" content="✨ Bienvenida Pereira — Cuenta Regresiva" />
  <meta property="og:description" content="Toca para ver cuánto falta para el sábado a las 7:00 AM." />
  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #141e30 0%, #090d16 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    canvas#fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Botón flotante de música ambiental */
    .audio-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .audio-btn:hover {
      border-color: rgba(255, 209, 102, 0.45);
      color: #ffffff;
    }

    .audio-btn.playing {
      border-color: rgba(255, 209, 102, 0.6);
      background: rgba(255, 209, 102, 0.15);
      color: #ffd166;
    }

    .equalizer {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      width: 12px;
    }

    .equalizer span {
      display: block;
      width: 2.5px;
      height: 4px;
      background: currentColor;
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .audio-btn.playing .equalizer span:nth-child(1) {
      animation: eqBounce 0.7s ease-in-out infinite alternate;
    }
    .audio-btn.playing .equalizer span:nth-child(2) {
      animation: eqBounce 0.5s ease-in-out 0.2s infinite alternate;
    }
    .audio-btn.playing .equalizer span:nth-child(3) {
      animation: eqBounce 0.8s ease-in-out 0.1s infinite alternate;
    }

    @keyframes eqBounce {
      from { height: 3px; }
      to { height: 12px; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 440px);
      padding: 2.2rem 1.5rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeInScale 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .card.celebrating {
      border-color: rgba(255, 209, 102, 0.55);
      box-shadow: 0 20px 60px rgba(255, 209, 102, 0.2);
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffd166;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.3);
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #ffd166 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      animation: glowPulse 3s ease-in-out infinite;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
      transition: color 0.4s ease;
    }

    .card.celebrating .subtitle {
      color: #ffd166;
      font-weight: 600;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.6rem;
    }

    .time-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 0.9rem 0.3rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .time-box.tick {
      transform: scale(1.03);
      border-color: rgba(255, 209, 102, 0.35);
    }

    .number {
      display: block;
      font-size: clamp(1.5rem, 5.5vw, 2rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      line-height: 1.1;
    }

    .label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-top: 0.35rem;
    }

    .footer-note {
      font-size: 0.82rem;
      color: #cbd5e1;
      opacity: 0.85;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.2)); }
      50% { filter: drop-shadow(0 0 18px rgba(255, 209, 102, 0.55)); }
    }
  </style>
</head>
<body>
  <canvas id="fx-canvas"></canvas>

  <!-- Botón opcional de música ambiental -->
  <button class="audio-btn" id="audio-toggle" type="button" aria-label="Reproducir o pausar música ambiental">
    <span class="equalizer" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
    <span id="audio-label">Música ambiental</span>
  </button>

  <main class="card" id="main-card">
    <span class="badge">Sábado • 7:00 AM</span>
    <h1>Bienvenida Pereira</h1>
    <p class="subtitle" id="status-text">Falta muy poco para vernos</p>

    <section class="timer-grid">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Días</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Horas</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Min</span>
      </div>
      <div class="time-box" id="sec-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seg</span>
      </div>
    </section>

    <p class="footer-note">Actualizado en tiempo real</p>
  </main>

  <script>
    // ==========================================
    // 1. CUENTA REGRESIVA Y DETECCIÓN DE LLEGADA
    // ==========================================
    const targetDate = new Date("2026-11-14T07:00:00-05:00").getTime();

    const mainCard = document.getElementById("main-card");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const secBox = document.getElementById("sec-box");
    const statusText = document.getElementById("status-text");

    let hasCelebrated = false;

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function triggerArrivalCelebration() {
      if (hasCelebrated) return;
      hasCelebrated = true;

      mainCard.classList.add("celebrating");
      statusText.textContent = "¡Llegó el momento! Bienvenida a Pereira ✨";

      // Explosión triple cuando el contador llega a cero
      spawnConfettiBurst(canvas.width * 0.5, canvas.height * 0.65, 140);
      setTimeout(() => {
        spawnConfettiBurst(canvas.width * 0.2, canvas.height * 0.6, 75);
        spawnConfettiBurst(canvas.width * 0.8, canvas.height * 0.6, 75);
      }, 500);
    }

    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        triggerArrivalCelebration();
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);

      secBox.classList.remove("tick");
      void secBox.offsetWidth;
      secBox.classList.add("tick");
    }

    // ==========================================
    // 2. CANVAS: PARTÍCULAS + CONFETI ANIMADO
    // ==========================================
    const canvas = document.getElementById("fx-canvas");
    const ctx = canvas.getContext("2d");
    let ambientParticles = [];
    let confettiPieces = [];

    const confettiColors = [
      "#ffd166", // Dorado cálido
      "#ef476f", // Coral vibrante
      "#06d6a0", // Verde esmeralda
      "#38bdf8", // Azul cielo
      "#f8fafc", // Blanco brillante
      "#c084fc"  // Violeta suave
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 45; i++) {
      ambientParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.2 + 0.6,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.6 - 0.2,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function spawnConfettiBurst(originX, originY, count) {
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const speed = Math.random() * 11 + 5;
        confettiPieces.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          w: Math.random() * 8 + 5,
          h: Math.random() * 5 + 3,
          color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.22,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: Math.random() * 0.08 + 0.03
        });
      }
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Partículas ambientales doradas
      for (const p of ambientParticles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.y < -10) p.y = canvas.height + 10;
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 209, 102, ${p.alpha})`;
        ctx.fill();
      }

      // Confeti animado con gravedad y giro 3D simulado
      for (let i = confettiPieces.length - 1; i >= 0; i--) {
        const c = confettiPieces[i];
        c.vy += 0.22;
        c.vx *= 0.985;
        c.swayPhase += c.swaySpeed;
        c.x += c.vx + Math.sin(c.swayPhase) * 0.9;
        c.y += c.vy;
        c.rotation += c.rotationSpeed;

        if (c.y > canvas.height + 30) {
          confettiPieces.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rotation);
        ctx.scale(1, Math.cos(c.swayPhase));
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
    renderLoop();

    // Explosión de bienvenida cada vez que se abre la animación
    setTimeout(() => {
      if (!hasCelebrated) {
        spawnConfettiBurst(canvas.width * 0.5, canvas.height * 0.65, 110);
      }
    }, 200);

    // ==========================================
    // 3. SINTETIZADOR DE MÚSICA AMBIENTAL
    // ==========================================
    const audioBtn = document.getElementById("audio-toggle");
    const audioLabel = document.getElementById("audio-label");

    let audioCtx = null;
    let masterGain = null;
    let chordInterval = null;
    let isPlaying = false;
    let chordStep = 0;

    const ambientChords = [
      [174.61, 220.00, 261.63, 329.63, 392.00],
      [130.81, 196.00, 246.94, 293.66, 329.63],
      [220.00, 261.63, 329.63, 392.00, 587.33],
      [196.00, 261.63, 329.63, 392.00, 440.00]
    ];

    function playAmbientChord(frequencies) {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;
      const duration = 5.2;

      frequencies.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const noteGain = audioCtx.createGain();

        osc.type = idx % 2 === 0 ? "sine" : "triangle";
        osc.frequency.setValueAtTime(freq, now);
        osc.detune.setValueAtTime((idx - 2) * 4, now);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(620, now);

        noteGain.gain.setValueAtTime(0.0001, now);
        noteGain.gain.linearRampToValueAtTime(0.032, now + 1.6);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(masterGain);

        osc.start(now);
        osc.stop(now + duration + 0.1);
      });
    }

    async function toggleAmbientMusic() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      if (!isPlaying) {
        isPlaying = true;
        audioBtn.classList.add("playing");
        audioLabel.textContent = "Pausar música";

        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
        masterGain.gain.linearRampToValueAtTime(0.85, now + 1.2);

        playAmbientChord(ambientChords[chordStep % ambientChords.length]);
        chordStep++;
        chordInterval = setInterval(() => {
          playAmbientChord(ambientChords[chordStep % ambientChords.length]);
          chordStep++;
        }, 4200);
      } else {
        isPlaying = false;
        audioBtn.classList.remove("playing");
        audioLabel.textContent = "Música ambiental";

        clearInterval(chordInterval);
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
      }
    }

    audioBtn.addEventListener("click", toggleAmbientMusic);
  </script>
</body>
  </html>
