    function drawHopChar(spr,x,gY,t,hopping,flipX=false){
      const hop=hopping?Math.round(Math.abs(Math.sin(t*11))*2.5):0;
      px("rgba(9,13,22,0.55)",x+2,gY-1,8,1);
      drawSprite(spr,PAL_C,x,gY-20-hop,flipX);
    }

    function drawDitherSky(cols){
      const bh=Math.ceil(H/cols.length);
      cols.forEach((c,i)=>{
        const y0=i*bh;px(c,0,y0,W,bh+1);
        if(i<cols.length-1){const dy=y0+bh-2;for(let x=0;x<W;x+=2){px(cols[i+1],x,dy,1,1);px(cols[i],x+1,dy+1,1,1);}}

    }
    function drawStars(t){
      [[14,18],[32,26],[58,14],[84,22],[112,16],[138,28],[24,42],[96,38]].forEach(([sx,sy],i)=>{
        if(sx<W&&sy<H*.45)px(Math.sin(t*3+i)>-.3?"#fef08a":"#94a3b8",sx,sy,1,1);
      });
    }
    function drawClouds(t,spd,yB){
      [{o:10,dy:0,w:28},{o:65,dy:12,w:36},{o:120,dy:-8,w:24},{o:170,dy:6,w:32}].forEach(c=>{
        const cx=W-(((t*spd+c.o)%(W+45)))-10,cy=yB+c.dy;
        px("#cbd5e1",cx+2,cy+4,c.w-4,2);px("#f1f5f9",cx,cy+1,c.w,3);px("#fff",cx+4,cy-2,c.w-8,3);px("#fff",cx+8,cy-4,Math.max(6,c.w-16),2);
      });
    }
    function drawBogotaHills(gY){
      pctx.fillStyle="#1e293b";pctx.beginPath();pctx.moveTo(0,gY);pctx.lineTo(0,gY-46);pctx.lineTo(W*.25,gY-76);pctx.lineTo(W*.52,gY-52);pctx.lineTo(W*.78,gY-70);pctx.lineTo(W,gY-44);pctx.lineTo(W,gY);pctx.fill();
      pctx.fillStyle="#0f172a";pctx.beginPath();pctx.moveTo(0,gY);pctx.lineTo(0,gY-30);pctx.lineTo(W*.38,gY-48);pctx.lineTo(W*.7,gY-34);pctx.lineTo(W,gY-50);pctx.lineTo(W,gY);pctx.fill();
      const mx=Math.round(W*.25),my=gY-82;px("#f8fafc",mx-3,my+2,6,4);px("#f8fafc",mx-1,my-1,2,3);px("#fef08a",mx,my+3,1,2);
    }
    function drawBogotaBlds(gY,t){
      [[4,18,52],[25,16,68],[44,20,46],[W-44,18,62],[W-22,18,44]].forEach(([x,w,h])=>{

        for(let wy=gY-h+5;wy<gY-10;wy+=6)for(let wx=x+3;wx<x+w-5;wx+=4)px(((wx*3+wy+Math.floor(t*.5))%4)?"#fde047":"#334155",wx,wy,2,3);

      px("#090d16",dx,gY-13,16,13);px("#7dd3fc",dx+1,gY-12,Math.max(2,6-sl),12);px("#7dd3fc",dx+9+sl,gY-12,Math.max(2,6-sl),12);

      });
    }
    function drawPlaneWithGear(ax,ay,tilt,gear){
      pctx.save();pctx.translate(Math.round(ax),Math.round(ay));pctx.rotate(tilt);
      drawSprite(PLANE_SPR,PAL_P,-32,-10);
      if(gear){
        px("#090d16",-13,8,2,3);px("#94a3b8",-13,10,2,2);
        px("#090d16",17,8,2,3);px("#94a3b8",17,10,2,2);
      }
      pctx.restore();
    }

    const targetDate=new Date("2026-11-14T07:00:00-05:00").getTime();
    const elD=document.getElementById("days"),elH=document.getElementById("hours"),elM=document.getElementById("minutes"),elS=document.getElementById("seconds"),sBox=document.getElementById("sec-box"),stTxt=document.getElementById("status-text"),card=document.getElementById("main-card");
    let celeb=false,conf=[];
    const cCols=["#ffd166","#ef476f","#06d6a0","#38bdf8","#f8fafc","#c084fc"];
    function spawnConf(ox,oy,n){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.9,sp=Math.random()*11+5;conf.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,w:Math.random()*8+5,h:Math.random()*5+3,c:cCols[i%cCols.length],r:Math.random()*6,rs:(Math.random()-.5)*.22,p:Math.random()*6,ps:Math.random()*.08+.03});}}
    function updateTimer(){
      const d=targetDate-Date.now();
      if(d<=0){elD.textContent=elH.textContent=elM.textContent=elS.textContent="00";if(!celeb){celeb=true;card.classList.add("celebrating");stTxt.textContent="¡Llegó el momento! Bienvenida a Pereira ✨";spawnConf(fx.width*.5,fx.height*.65,130);}return;}
      const pad=v=>String(v).padStart(2,"0");
      elD.textContent=pad(Math.floor(d/86400000));elH.textContent=pad(Math.floor((d/3600000)%24));elM.textContent=pad(Math.floor((d/60000)%60));elS.textContent=pad(Math.floor((d/1000)%60));
      sBox.classList.remove("tick");void sBox.offsetWidth;sBox.classList.add("tick");
    }
    updateTimer();setInterval(updateTimer,1000);
    setTimeout(()=>{if(!celeb)spawnConf(fx.width*.5,fx.height*.65,95);},200);

    // Duración personalizada por escena (Escena 3 = 1550ms para la toma exterior de ventanilla)
    const DURS=[4600,4200,4200,1550,4200,4800,4000,5800];
    let sc=0,el=0,last=performance.now();

    function loop(now){
      const dt=Math.min(100,now-last);last=now;el+=dt;
      if(el>=DURS[sc]){el=0;sc=(sc+1)%8;}
      const pr=el/DURS[sc],t=el/1000,gY=Math.round(H*.81);
      pctx.clearRect(0,0,W,H);

      if(sc===0){
        drawDitherSky(["#090d16","#1e1b4b","#4c1d95","#9d174d","#ea580c"]);drawStars(t);drawBogotaHills(gY);drawBogotaBlds(gY,t);
        drawLamp(Math.round(W*.78),gY);drawSign("BOGOT\u00c1",Math.round(W*.86),gY);drawRoad(gY);
        const gx=Math.round(W*.66);
        if(pr<.75){
          drawSprite(BAG_SPR,PAL_C,gx+12,gY-10);
          drawHopChar(pr<.55?GIRL_WAVE:GIRL_SPR,gx,gY,t,false);
        }else{
          const hp=(pr-.75)/.25;
          drawHopChar(GIRL_SPR,gx-12*hp,gY,t,true,true);
          drawSprite(BAG_SPR,PAL_C,gx+12-16*hp,gY-10);
        }
        const mr=Math.min(1,pr/.6),ez=1-Math.pow(1-mr,3),tx=-48+(gx-46+48)*ez,bob=mr<.98?Math.round(Math.sin(t*25)):0;
        pctx.fillStyle="rgba(254,240,138,.2)";pctx.beginPath();pctx.moveTo(tx+41,gY-7+bob);pctx.lineTo(tx+66,gY-12);pctx.lineTo(tx+66,gY+2);pctx.lineTo(tx+41,gY-4+bob);pctx.fill();
        drawSprite(TAXI_SPR,PAL_T,tx,gY-15+bob);
      }else if(sc===1){
        drawDitherSky(["#0369a1","#0284c7","#38bdf8","#bae6fd"]);drawClouds(t,3,Math.round(H*.36));drawTower(10,gY,t);
        const tw=Math.min(112,W-26),tx=Math.floor((W-tw)/2)+6,open=pr>.5?Math.min(1,(pr-.5)/.2):0;
        drawTerminal("EL DORADO","BOGOT\u00c1",tx,gY,tw,false,open);drawRoad(gY);
        const sx=Math.round(W*.16),mr=Math.min(1,pr/.4),ez=1-Math.pow(1-mr,3),taxiX=-46+(sx+46)*ez,bob=mr<.98?Math.round(Math.sin(t*25)):0;
        drawSprite(TAXI_SPR,PAL_T,taxiX,gY-15+bob);
        if(pr>=.4){
          const wr=(pr-.4)/.6,dx=tx+Math.floor(tw/2)-5,gx=(sx+40)+(dx-(sx+40))*wr;
          drawHopChar(GIRL_SPR,gx,gY,t,true);
          drawSprite(BAG_SPR,PAL_C,gx-9,gY-10);
        }
      }else if(sc===2){
        drawDitherSky(["#0c4a6e","#0284c7","#38bdf8","#7dd3fc","#e0f2fe"]);drawClouds(t,8,Math.round(H*.38));drawBogotaHills(gY);drawTower(Math.round(W*.14),gY,t);drawRunway(gY,t);
        const pxX=-45+(W+75)*pr,cl=pr>.36,cp=cl?(pr-.36)/.64:0,lift=Math.pow(cp,1.55)*(H*.44),pxY=(gY-12)-lift,tilt=cl?-.25*Math.min(1,cp*2.2):0;
        drawPlaneWithGear(pxX,pxY,tilt,!cl);
      }else if(sc===3){
        // TOMA EXTERIOR DE LA VENTANA DEL AVIÓN (1.55 SEGUNDOS)
        drawDitherSky(["#0284c7","#38bdf8","#7dd3fc","#bae6fd"]);
        drawClouds(t,22,Math.round(H*.38));
        for(let i=0;i<7;i++){
          const lx=W-(((t*160+i*28)%(W+30))),ly=Math.round(H*(.32+(i%5)*.13));
          px("rgba(255,255,255,.55)",lx,ly,14,1);
        }
        const vib=Math.round(Math.sin(t*24)*.6),fy=Math.round(H*.53)+vib,fh=Math.round(H*.34);
        px("#cbd5e1",0,fy-2,W,2);px("#f8fafc",0,fy,W,fh-10);px("#e2e8f0",0,fy+fh-10,W,6);
        px("#1d4ed8",0,fy+fh-8,W,3);px("#facc15",0,fy+fh-5,W,2);px("#64748b",0,fy+fh-4,W,4);
        const ww=24,wh=28,wx=Math.floor((W-ww)/2),wy=fy+Math.floor((fh-wh)/2)-3;
        px("#94a3b8",wx-3,wy-3,ww+6,wh+6);px("#0f172a",wx-1,wy-1,ww+2,wh+2);px("#0369a1",wx,wy,ww,wh);
        px("#1e293b",wx+1,wy+6,5,18);
        drawSprite(GIRL_FACE,PAL_C,wx+6,wy+11);
        px("rgba(255,255,255,.3)",wx+2,wy+2,2,10);px("rgba(255,255,255,.2)",wx+5,wy+3,1,7);
        const sx2=wx+ww+16;
        if(sx2+14<W){px("#94a3b8",sx2-2,wy,16,wh);px("#0f172a",sx2-1,wy+1,14,wh-2);px("#38bdf8",sx2,wy+2,12,wh-4);}
      }
      else if(sc===4){
        drawDitherSky(["#0284c7","#38bdf8","#7dd3fc","#fef08a"]);drawClouds(t,4,Math.round(H*.36));
        const vY=Math.round(H*.68);drawCoffeeHills(vY);
        px("#065f46",0,vY,W,H-vY);px("#0284c7",0,vY+18,W,6);px("#38bdf8",0,vY+20,W,2);
        for(let bx=6;bx<W-10;bx+=9){const bh=6+(bx%7);px("#e2e8f0",bx,vY+28-bh,6,bh);px("#dc2626",bx,vY+28-bh,6,2);}
        const dY=vY+10;px("#f8fafc",0,dY,W,2);px("#94a3b8",0,dY+2,W,1);
        [Math.round(W*.34),Math.round(W*.68)].forEach(p=>{
          px("#f8fafc",p-1,dY-16,3,28);px("#ef4444",p,dY-18,1,2);
          for(let k=1;k<=4;k++){px("#cbd5e1",p-k*3,dY-12+k*3,1,1);px("#cbd5e1",p+k*3,dY-12+k*3,1,1);}
        });
        drawSign("PEREIRA",Math.round(W*.16),H-6);
        drawPlaneWithGear(-30+(W+40)*pr,Math.round(H*.44)+pr*24,.14,true);
      }else if(sc===5){
        // ATERRIZAJE REAL EN EL SUELO (EJE CAFETERO Y MATECAÑA)
        drawDitherSky(["#0284c7","#38bdf8","#bae6fd","#fde68a"]);drawCoffeeHills(gY);
        drawFinca(8,gY-2);drawCoffeeRows(4,34,gY);drawPalm(42,gY,t);
        const tw=Math.min(76,Math.floor(W*.56));
        drawTerminal("MATECA\u00d1A","PEREIRA",W-tw-4,gY,tw,true,0);drawRunway(gY,t);

        const td=0.56,startY=Math.round(H*.44),endY=gY-12;
        const xStart=-32,xTouch=Math.round(W*.44),xStop=Math.round(W*.68);
        let ax,ay,tilt;
        if(pr<td){
          const u=pr/td,ez=1-Math.pow(1-u,2.1);
          ax=xStart+(xTouch-xStart)*u;
          ay=startY+(endY-startY)*ez;
          tilt=.16*(1-ez);
        }else{
          const r=(pr-td)/(1-td),ez=1-Math.pow(1-r,2.2);
          ax=xTouch+(xStop-xTouch)*ez;
          ay=endY;
          tilt=0;
        }
        drawPlaneWithGear(ax,ay,tilt,true);
        if(pr>=td&&pr<td+.28){
          const sp=(pr-td)/.28;
          px("#f8fafc",ax-14-sp*6,gY-3,5,3);
          px("#cbd5e1",ax+15-sp*5,gY-3,4,3);
        }
      }else if(sc===6){
        drawDitherSky(["#0284c7","#38bdf8","#7dd3fc","#fef08a"]);drawCoffeeHills(gY);
        const tw=Math.min(94,W-26),tx=6,open=pr<.5?Math.min(1,pr/.2):Math.max(0,1-(pr-.5)/.25);
        drawTerminal("MATECA\u00d1A","PEREIRA",tx,gY,tw,true,open);drawPalm(W-12,gY,t);drawRoad(gY);
        const sg=tx+Math.floor(tw/2)-5,gx=sg+(Math.round(W*.76)-sg)*pr;
        drawHopChar(GIRL_SPR,gx,gY,t,true);
        drawSprite(BAG_SPR,PAL_C,gx-9,gY-10);
      }else{
        drawDitherSky(["#1e1b4b","#6d28d9","#db2777","#f97316","#fde047"]);drawCoffeeHills(gY);
        drawPalm(10,gY,t);drawPalm(W-14,gY,t);drawSign("PEREIRA",Math.round(W*.18),gY);drawRoad(gY);
        const c=Math.round(W*.52);
        drawSprite(BAG_SPR,PAL_C,c-22,gY-10);
        if(pr<.42){
          const ap=pr/.42;
          drawHopChar(GIRL_SPR,(c-16)+7*ap,gY,t,true);
          drawHopChar(BOY_SPR,(W-16)-((W-16)-(c+2))*ap,gY,t,true,true);
        }else{
          const sw=Math.round(Math.sin(t*2.5)*.6);
          px("rgba(9,13,22,0.55)",c-8+sw,gY-1,16,1);
          drawSprite(HUG_SPR,PAL_C,c-10+sw,gY-18);
          drawHearts(c,gY-20,t);
        }
      }

      const fin=Math.min(260,DURS[sc]*.16);
      const fa=el<fin?1-el/fin:(el>DURS[sc]-fin?(el-(DURS[sc]-fin))/fin:0);
      if(fa>0){pctx.fillStyle=`rgba(9,13,22,${fa.toFixed(2)})`;pctx.fillRect(0,0,W,H);}

      fctx.clearRect(0,0,fx.width,fx.height);
      for(let i=conf.length-1;i>=0;i--){
        const c=conf[i];c.vy+=.22;c.vx*=.985;c.p+=c.ps;c.x+=c.vx+Math.sin(c.p)*.9;c.y+=c.vy;c.r+=c.rs;
        if(c.y>fx.height+30){conf.splice(i,1);continue;}
        fctx.save();fctx.translate(c.x,c.y);fctx.rotate(c.r);fctx.scale(1,Math.cos(c.p));fctx.fillStyle=c.c;fctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);fctx.restore();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    const aBtn=document.getElementById("audio-toggle"),aLbl=document.getElementById("audio-label");
    let actx=null,gain=null,iv=null,play=false,step=0;
    const ch=[[174.61,220,261.63,329.63,392],[130.81,196,246.94,293.66,329.63],[220,261.63,329.63,392,587.33],[196,261.63,329.63,392,440]];
    function pCh(f){if(!actx||!play)return;const n=actx.currentTime;f.forEach((hz,i)=>{const o=actx.createOscillator(),fl=actx.createBiquadFilter(),g=actx.createGain();o.type=i%2?"triangle":"sine";o.frequency.setValueAtTime(hz,n);o.detune.setValueAtTime((i-2)*4,n);fl.type="lowpass";fl.frequency.setValueAtTime(620,n);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.032,n+1.6);g.gain.exponentialRampToValueAtTime(.0001,n+5.2);o.connect(fl);fl.connect(g);g.connect(gain);o.start(n);o.stop(n+5.3);});}
    aBtn.addEventListener("click",async()=>{
      if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();gain=actx.createGain();gain.gain.setValueAtTime(.0001,actx.currentTime);gain.connect(actx.destination);}
      if(actx.state==="suspended")await actx.resume();
      const n=actx.currentTime;
      if(!play){play=true;aBtn.classList.add("playing");aLbl.textContent="Pausar";gain.gain.cancelScheduledValues(n);gain.gain.setValueAtTime(Math.max(gain.gain.value,.0001),n);gain.gain.linearRampToValueAtTime(.85,n+1.2);pCh(ch[step++%4]);iv=setInterval(()=>pCh(ch[step++%4]),4200);}
      else{play=false;aBtn.classList.remove("playing");aLbl.textContent="Música";clearInterval(iv);gain.gain.cancelScheduledValues(n);gain.gain.setValueAtTime(Math.max(gain.gain.value,.0001),n);gain.gain.exponentialRampToValueAtTime(.0001,n+.8);}
    });
  </script>
</body>
</html>
